<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Contador de Horas</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app">
    <header class="app-header">
      <div>
        <h1>Contador de Horas</h1>
        <p class="subtitle"></p>
      </div>
    </header>

    <main class="layout">
      <section class="left">
        <div class="card counter-card">
          <h2>Total de Horas</h2>
          <div class="hours-display">
            <button id="decrease" class="big-btn" title="Diminuir 0.25h">−</button>
            <div id="totalHours" class="total">0.00</div>
            <button id="increase" class="big-btn" title="Aumentar 0.25h">+</button>
          </div>

          <div class="quick-actions">
            <input id="customHours" type="number" step="0.25" min="0" placeholder="Ex: 1.5" />
            <div class="actions">
              <button id="addCustom">Adicionar</button>
              <button id="subCustom">Subtrair</button>
              <button id="resetHours" class="ghost">Resetar Tudo</button>
            </div>
          </div>

          <p class="hint">Clique em um dia do calendário para atribuir horas a ele. O total é a soma dos dias.</p>
        </div>

        <div class="card notes-card">
          <h2>Anotações</h2>
          <textarea id="notes" placeholder="Escreva suas notas aqui..."></textarea>
          <div class="note-actions">
            <button id="saveNotes">Salvar</button>
            <button id="clearNotes" class="ghost">Limpar</button>
          </div>
        </div>
      </section>

      <section class="right">
        <div class="card calendar-card">
          <div class="cal-header">
            <button id="prevMonth" aria-label="Mês anterior">‹</button>
            <div class="month-year" id="monthYear">Mês Ano</div>
            <button id="nextMonth" aria-label="Próximo mês">›</button>
          </div>

          <div class="weekdays">
            <div>Dom</div><div>Seg</div><div>Ter</div><div>Qua</div><div>Qui</div><div>Sex</div><div>Sáb</div>
          </div>

          <div class="calendar" id="calendar"></div>
        </div>
      </section>
    </main>

    <footer class="app-footer">
      <small></small>
    </footer>
  </div>

  <!-- Modal simples -->
  <div id="dayModal" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="modalDate">
    <div class="modal-content">
      <h3 id="modalDate">Data</h3>
      <label for="modalHours">Horas neste dia</label>
      <input id="modalHours" type="number" step="0.25" min="0" placeholder="0.00" />
      <div class="modal-actions">
        <button id="saveDayHours">Salvar</button>
        <button id="clearDayHours" class="ghost">Limpar</button>
        <button id="closeModal" class="ghost">Fechar</button>
      </div>
    </div>
  </div>

  <script src="script.js" defer></script>
</body>
</html>
